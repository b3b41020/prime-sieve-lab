name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: C++ correctness suite (serial + parallel determinism)
        run: ctest --test-dir build --output-on-failure
      - name: Bot preflight self-test hook
        run: bash bot/selftest_hook.sh
      - name: Bot bridge end-to-end (real HTTP + real binaries)
        run: python3 tests/test_bot_bridge.py
